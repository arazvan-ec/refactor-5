# Generated by /workflows:discover --setup on 2026-02-17
# Template: core/templates/architecture-profile-template.yaml

stack:
  language: "PHP 8.1+"
  framework: "Symfony 6.4 LTS"
  paradigm: "oop"
  type_system: "strong-dynamic"

architecture:
  pattern: "ddd-layered"
  layers:
    - name: "presentation"
      path: "src/Controller/V1/"
      depends_on: ["application"]
    - name: "application"
      path: "src/Application/, src/Orchestrator/"
      depends_on: ["domain-external"]
    - name: "infrastructure"
      path: "src/Infrastructure/, src/Ec/"
      depends_on: ["domain-external"]
    - name: "framework"
      path: "src/DependencyInjection/, src/Kernel.php"
      depends_on: ["application", "infrastructure"]
  separation_enforced: true

patterns_detected:
  data_access: "query-client-packages"
  dependency_management: "constructor-injection + compiler-passes"
  error_handling: "exceptions + try-catch-log-continue"
  async_pattern: "guzzle-promises-with-sync-wait"
  testing_approach: "tdd"
  http_client_pattern: "httplug-abstraction-with-guzzle7-adapter"
  external_api_integration: "vendor-packages-with-domain-interfaces"
  serialization_strategy: "manual-write-read-transformers"
  multi_platform_output: "single-format-json"
  data_aggregation_pattern: "orchestrator-chain-of-responsibility"

external_apis_consumed:
  - name: "Editorial Service"
    sdk: "ec/editorial-client ^2.2"
    adapter: "Ec\\Editorial\\Infrastructure\\Client\\Http\\QueryEditorialClient"
    port: "Ec\\Editorial\\Domain\\Model\\QueryEditorialClient"
    acl_compliant: true
  - name: "Section Service"
    sdk: "ec/section-client ^3.0"
    adapter: "Ec\\Section\\Infrastructure\\Client\\Http\\QuerySectionClient"
    port: "Ec\\Section\\Domain\\Model\\QuerySectionClient"
    acl_compliant: true
  - name: "Multimedia Service"
    sdk: "ec/multimedia-client ^5.0"
    adapter: "Ec\\Multimedia\\Infrastructure\\Client\\Http\\QueryMultimediaClient"
    port: "Ec\\Multimedia\\Domain\\Model\\QueryMultimediaClient"
    acl_compliant: true
  - name: "Journalist Service"
    sdk: "ec/journalist-client ^5.1"
    adapter: "Ec\\Journalist\\Infrastructure\\Client\\Http\\QueryJournalistClient"
    port: "Ec\\Journalist\\Domain\\Model\\QueryJournalistClient"
    acl_compliant: true
  - name: "Tag Service"
    sdk: "ec/tag-client ^4.0"
    adapter: "Ec\\Tag\\Infrastructure\\Client\\Http\\QueryTagClient"
    port: "Ec\\Tag\\Domain\\Model\\QueryTagClient"
    acl_compliant: true
  - name: "Membership Service"
    sdk: "ec/membership-client ^1.5"
    adapter: "Ec\\Membership\\Infrastructure\\Client\\Http\\QueryMembershipClient"
    port: "Ec\\Membership\\Domain\\Model\\QueryMembershipClient"
    acl_compliant: true
  - name: "Widget Service"
    sdk: "ec/widget-client ^2.0"
    adapter: "Ec\\Widget\\Infrastructure\\Client\\Http\\QueryWidgetClient"
    port: "Ec\\Widget\\Domain\\Model\\QueryWidgetClient"
    acl_compliant: true
  - name: "Legacy API"
    sdk: "custom (App\\Ec\\Snaapi)"
    adapter: "App\\Ec\\Snaapi\\Infrastructure\\Client\\Http\\QueryLegacyClient"
    port: "none"
    acl_compliant: false

solid_relevance:
  srp:
    relevance: "high"
    metric: "classes <=200 LOC, <=7 public methods"
    when_violated: "Extract Class, then compose via DI"
    reference_good: "src/Application/DataTransformer/Apps/Body/ParagraphDataTransformer.php"
  ocp:
    relevance: "high"
    metric: "no switch/if-else chains by type, use compiler passes + tags"
    when_violated: "Strategy pattern via tagged services"
    reference_good: "src/DependencyInjection/Compiler/BodyDataTransformerCompiler.php"
  lsp:
    relevance: "medium"
    metric: "overrides respect parent contract, consistent return types"
    when_violated: "Composition over Inheritance"
    reference_good: "src/Orchestrator/Chain/Multimedia/MultimediaPhotoOrchestrator.php"
  isp:
    relevance: "high"
    metric: "interfaces <=5 methods"
    when_violated: "Split into role-specific interfaces"
    reference_good: "src/Orchestrator/Chain/EditorialOrchestratorInterface.php"
  dip:
    relevance: "high"
    metric: "Application/ imports zero from Infrastructure/"
    when_violated: "Port interface in Domain/Application, Adapter in Infrastructure"
    reference_good: "config/packages/editorial.yaml (interface aliasing)"

conventions:
  naming:
    classes: "PascalCase"
    methods: "camelCase"
    files: "match-class-name"
    constants: "UPPER_SNAKE_CASE"
    enums: "PascalCase with UPPER_SNAKE_CASE cases"
  structure:
    controllers: "src/Controller/V1/"
    orchestrators: "src/Orchestrator/"
    transformers: "src/Application/DataTransformer/"
    services: "src/Infrastructure/Service/"
    enums: "src/Infrastructure/Enum/"
    compiler_passes: "src/DependencyInjection/Compiler/"
    tests: "tests/ (mirrors src/ structure)"
  suffixes:
    handler: "*Handler (Chain of Responsibility)"
    orchestrator: "*Orchestrator (Strategy implementations)"
    transformer: "*DataTransformer (Data transformation)"
    compiler: "*Compiler (DI Compiler Passes)"
    subscriber: "*Subscriber (Event listeners)"
  reference_files:
    orchestrator: "src/Orchestrator/Chain/Multimedia/MultimediaPhotoOrchestrator.php"
    transformer: "src/Application/DataTransformer/Apps/Body/ParagraphDataTransformer.php"
    compiler: "src/DependencyInjection/Compiler/BodyDataTransformerCompiler.php"
    controller: "src/Controller/V1/EditorialController.php"
    enum: "src/Infrastructure/Enum/EditorialTypesEnum.php"
    test: "tests/Application/DataTransformer/Apps/Body/ParagraphDataTransformerTest.php"

quality_thresholds:
  max_class_loc: 200
  max_public_methods: 7
  max_constructor_deps: 7
  max_interface_methods: 5
  max_files_per_simple_change: 5
  phpstan_level: 9
  mutation_msi_min: 86
  mutation_covered_msi_min: 87
  code_style: "PSR-12 + Symfony"
  php_indent: 4
  max_line_length: 120
